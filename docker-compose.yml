version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: castleweb_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-castleweb_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-castleweb_secret_pass}
      POSTGRES_DB: ${POSTGRES_DB:-castleweb_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-castleweb_user} -d ${POSTGRES_DB:-castleweb_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: castleweb_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: castleweb_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./apps/backend/.env
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./apps/backend/data:/app/data
      - backend_uploads:/app/uploads

volumes:
  postgres_data:
  redis_data:
  backend_uploads:

networks:
  default:
    name: castleweb_network
