name: castleweb

services:
  postgres:
    image: postgres:16-alpine
    container_name: castleweb_prod_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-castleweb_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-castleweb_secret_pass}
      POSTGRES_DB: ${POSTGRES_DB:-castleweb_db}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-castleweb_user} -d ${POSTGRES_DB:-castleweb_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - castleweb_internal

  redis:
    image: redis:7-alpine
    container_name: castleweb_prod_redis
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--requirepass", "${REDIS_PASSWORD:-castleweb_redis_pass}"]
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-castleweb_redis_pass}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - castleweb_internal

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: castleweb_prod_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./apps/backend/.env
    environment:
      - APP_ENV=production
      - DEBUG=False
      - CLOUDFLARE_TURNSTILE_ENABLED=False
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-castleweb_user}:${POSTGRES_PASSWORD:-castleweb_secret_pass}@postgres:5432/${POSTGRES_DB:-castleweb_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-castleweb_redis_pass}@redis:6379/0
      - PARSER_INTERNAL_URL=http://leadhunter:8000
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-castleweb-internal-demo-secret}
      - PARSER_PUBLIC_URL=https://leads.${DOMAIN_NAME:-castleweb.ru}
    volumes:
      - ./apps/backend/data:/app/data
      - uploads_prod_data:/app/uploads
    networks:
      - castleweb_internal
    expose:
      - "8000"
    ports:
      - "127.0.0.1:8000:8000"

  leadhunter:
    build:
      context: ./apps/parser
      dockerfile: Dockerfile
    container_name: castleweb_prod_leadhunter
    restart: always
    env_file:
      - ./apps/parser/.env
    environment:
      - APP_ENV=production
      - PORT=8000
      - HOST=0.0.0.0
      - HEADLESS=1
      - BACKEND_INTERNAL_URL=http://backend:8000
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-castleweb-internal-demo-secret}
    volumes:
      - leadhunter_data:/app/data
      - leadhunter_exports:/app/exports
      - leadhunter_profiles:/app/browser_profile
    networks:
      - castleweb_internal
    expose:
      - "8000"
    ports:
      - "127.0.0.1:8080:8000"
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1500M

  nginx:
    image: nginx:alpine
    container_name: castleweb_prod_nginx
    restart: always
    depends_on:
      - backend
      - leadhunter
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./apps/frontend/dist:/var/www/castleweb/frontend:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
      - uploads_prod_data:/app/uploads:ro
    networks:
      - castleweb_internal

  certbot:
    image: certbot/certbot:latest
    container_name: castleweb_certbot
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/www/certbot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - castleweb_internal

  # =========================================================================
  # PostgreSQL Backup Cron — local compressed dumps every 12 hours
  # Retains last 14 backups (~7 days)
  # =========================================================================
  pg_backup:
    image: postgres:16-alpine
    container_name: castleweb_pg_backup
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-castleweb_user}
      PGPASSWORD: ${POSTGRES_PASSWORD:-castleweb_secret_pass}
      PGDATABASE: ${POSTGRES_DB:-castleweb_db}
    volumes:
      - pg_backups:/backups
    entrypoint: >
      /bin/sh -c '
        apk add --no-cache gzip >/dev/null 2>&1;
        echo "🗄️ Backup cron started. Running every 12 hours.";
        while true; do
          STAMP=$$(date +%Y%m%d_%H%M%S);
          FILE="/backups/castleweb_$${STAMP}.sql.gz";
          pg_dump | gzip > "$$FILE" 2>/dev/null;
          if [ $$? -eq 0 ]; then
            SIZE=$$(du -h "$$FILE" | cut -f1);
            echo "[$$STAMP] ✅ Backup OK: $$FILE ($$SIZE)";
          else
            echo "[$$STAMP] ❌ Backup FAILED";
            rm -f "$$FILE";
          fi;
          ls -t /backups/castleweb_*.sql.gz 2>/dev/null | tail -n +15 | xargs rm -f 2>/dev/null;
          sleep 43200;
        done
      '
    networks:
      - castleweb_internal

volumes:
  postgres_prod_data:
  redis_prod_data:
  uploads_prod_data:
  pg_backups:
  leadhunter_data:
  leadhunter_exports:
  leadhunter_profiles:

networks:
  castleweb_internal:
    driver: bridge
