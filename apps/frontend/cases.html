<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Кейсы — Castleweb Studio</title>
  <meta name="description" content="Портфолио выполненных проектов Castleweb Studio: от премиальных ювелирных брендов и e-commerce до B2B-платформ и логистических сервисов" />
  
  <link rel="icon" type="image/svg+xml" sizes="any" href="assets/cw_logo.svg" />
  <link rel="stylesheet" href="style.css" />
  <script>document.documentElement.classList.add('js-ready');</script>
</head>
<body>

  <!-- ==================== FIXED HEADER ==================== -->
  <header class="site-header">
    <div class="stage-top-left">
      <a href="index.html" class="brand-logo" aria-label="Castleweb Studio">
        <img src="assets/cw_logo.svg" alt="Castleweb Studio Logo" />
      </a>
      <div class="stage-socials">
        <a href="https://t.me/kupidon996" target="_blank" rel="noopener">TELEGRAM</a>
        <a href="instagram.html">INSTAGRAM</a>
      </div>
    </div>

    <!-- Pinned Navigation -->
    <nav class="stage-nav" aria-label="Main Navigation">
      <a href="index.html" class="nav-link">[ ]&nbsp;ГЛАВНАЯ</a>
      <a href="cases.html" class="nav-link active">[•]&nbsp;КЕЙСЫ</a>
    </nav>

    <!-- Right: CTA -->
    <div class="stage-top-right">
      <div class="stage-cta">
        <a href="brief.html" class="stage-cta-link">
          <span>ОБСУДИТЬ ПРОЕКТ</span>
          <img src="assets/btn_icon.svg" alt="" class="stage-cta-icon" />
        </a>
        <div class="stage-cta-line"></div>
      </div>
    </div>
  </header>

  <!-- ==================== CASES PAGE CONTENT ==================== -->
  <main class="page-container cases-page-container">
    <div class="cases-page-header reveal-item">
      <h1 class="cases-page-title">КЕЙСЫ</h1>
      <span class="cases-page-count">[ 03 ПРОЕКТА ]</span>
    </div>

    <div class="all-cases-grid">
      <!-- Case 01: Onyx OS -->
      <div class="case-card reveal-item reveal-scale" data-case-id="onyx-os">
        <div class="case-card-visual">
          <img src="assets/onyx-launcher.jpg" alt="Onyx OS — Шелл для ПК-клуба" class="case-card-img" />
        </div>
        <div class="case-card-info">
          <span class="case-card-name">Onyx OS — Шелл для ПК-клуба</span>
          <span class="case-card-num">[01]</span>
        </div>
      </div>

      <!-- Case 02: Skog Chalet & Hytte Control -->
      <div class="case-card reveal-item reveal-scale" data-case-id="event-platform">
        <div class="case-card-visual">
          <img src="assets/post-2.png" alt="Skog Chalet & Hytte Control" class="case-card-img" />
        </div>
        <div class="case-card-info">
          <span class="case-card-name">Skog Chalet & Hytte Control</span>
          <span class="case-card-num">[02]</span>
        </div>
      </div>

      <!-- Case 03: LeadHunter -->
      <div class="case-card reveal-item reveal-scale" data-case-id="leadhunter">
        <div class="case-card-visual">
          <img src="assets/leadhunter-dashboard.png" alt="LeadHunter — Парсер Яндекс.Карт" class="case-card-img" />
        </div>
        <div class="case-card-info">
          <span class="case-card-name">LeadHunter — Парсер Яндекс.Карт</span>
          <span class="case-card-num">[03]</span>
        </div>
      </div>
    </div>
  </main>

  <!-- ==================== CASE MODAL POPUP ==================== -->
  <div class="case-modal-overlay" id="case-modal">
    <div class="case-modal-box case-modal-content">
      <div class="case-modal-header">
        <h3 class="case-modal-title" id="modal-case-title">Кейс</h3>
        <button class="case-modal-close" id="case-modal-close" aria-label="Закрыть">✕</button>
      </div>
      <div class="case-modal-body">
        <div class="case-modal-tabs" id="modal-case-tabs" style="display: none;"></div>
        <div class="case-modal-gallery" id="modal-case-gallery">
          <img src="" alt="" class="case-modal-single-img" id="modal-case-img" />
        </div>
        <p id="modal-case-desc" style="font-size: 16px; line-height: 1.4; color: var(--text-primary); max-width: 700px;"></p>
        <div style="margin-top: 10px; display: flex; gap: 14px; flex-wrap: wrap; align-items: center;" id="modal-actions-container">
          <a href="brief.html" class="stage-cta-link" style="display: inline-flex; width: 232px;">
            <span>ОБСУДИТЬ ПОДОБНЫЙ</span>
            <img src="assets/btn_icon.svg" alt="↗" />
          </a>
          <a href="https://t.me/castleweb_bot?start=demo" target="_blank" class="stage-cta-link demo-cta-btn" id="modal-demo-btn" style="display: none; width: auto; padding: 0 16px; background: #ffffff; color: #000000; border-color: #ffffff;">
            <span>ЕСЛИ ХОТИТЕ ПРОТЕСТИРОВАТЬ, НАПИШИТЕ В TELEGRAM БОТУ</span>
            <img src="assets/btn_icon.svg" alt="↗" style="filter: invert(1);" />
          </a>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/main.js"></script>
</body>
</html>
