  <meta name="robots" content="noindex, follow" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/icon-32.png" sizes="32x32" type="image/png" />

<body class="nf ty">
  <div class="nf__art" data-mosaic>
    <canvas role="img" aria-label="Замок на скале у фьорда, собранный из символов кода. Во всех окнах горит свет"></canvas>
  </div>

  <header class="nf__top">
    <a class="logo" href="/" aria-label="Castleweb, на главную">
      <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M2 18V7h3v3h2V4h2v2h2V4h2v6h2V7h3v11h-6v-4a2 2 0 0 0-4 0v4z" fill="currentColor"/></svg>

  <main class="nf__card" id="main">
    <h1 class="ty__word">Спасибо</h1>
    <p class="nf__title">Заявка уже в замке</p>
    <p class="nf__text">В окнах зажгли свет: её читают оба основателя студии. Ответим лично в течение одного-двух часов на контакт, который вы оставили.</p>
    <div class="nf__actions">
      <a class="btn btn--light" href="https://t.me/kupidon996" target="_blank" rel="noopener" data-goal="tg_click">Написать в Telegram</a>
      <a class="btn nf__ghost" href="/">На главную</a>
    </div>
    <nav class="ty__more" aria-labelledby="ty-more">
      <p id="ty-more">Пока ждёте ответа</p>
      <a class="text-link" href="/cases.html">Кейсы</a>

      <a class="text-link" href="https://t.me/castleweb_bot" target="_blank" rel="noopener" data-goal="demo_bot">Демо-бот</a>
    </nav>
    <!-- Время приёма появляется только после настоящей отправки формы (thanks.js) -->
    <p class="ty__received" data-received hidden></p>
  </main>

  <script type="module" src="/src/js/thanks.js"></script>
