name: 🏰 CASTLEWEB Backend CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: 🧪 Run Linters & Pytest
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/backend/requirements.txt

      - name: 🧪 Run Pytest Suite
        env:
          APP_ENV: testing
          DATABASE_URL: sqlite+aiosqlite:///./test_castleweb.db
          REDIS_URL: redis://localhost:6379/0
          TELEGRAM_BOT_TOKEN: ""
          CLOUDFLARE_TURNSTILE_ENABLED: "False"
        run: |
          cd apps/backend
          pytest -v

  deploy:
    name: 🚀 Production Auto-Deploy
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # На уровне job: env самого шага в его if ещё не доступен, и шаг всегда пропускался
    env:
      HAS_SSH_SECRETS: ${{ secrets.PROD_HOST != '' }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔑 Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        if: env.HAS_SSH_SECRETS == 'true'
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_PORT || 22 }}
          script: |
            cd ~/castleweb
            git pull origin main
            if [ -f "apps/frontend/package.json" ]; then
              echo "🔨 Rebuilding frontend..."
              docker run --rm -v "$(pwd)/apps/frontend":/app -w /app node:22-alpine sh -c "npm ci && npm run build"
            fi
            docker compose -f docker-compose.prod.yml up -d --build
            # nginx.conf.d смонтирован томом: без reload новый конфиг (редиректы, 404) не применится
            docker compose -f docker-compose.prod.yml exec -T nginx nginx -s reload || true
            docker image prune -f

