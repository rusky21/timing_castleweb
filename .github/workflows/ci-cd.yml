name: CASTLEWEB CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/backend/requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q apps/backend/app apps/parser/app

      - name: Run backend tests
        working-directory: apps/backend
        env:
          APP_ENV: testing
          DATABASE_URL: sqlite+aiosqlite:///./test_castleweb.db
          REDIS_URL: redis://localhost:6379/0
          TELEGRAM_BOT_TOKEN: ""
          CLOUDFLARE_TURNSTILE_ENABLED: "False"
        run: |
          alembic upgrade head
          pytest -v

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/frontend
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        working-directory: apps/frontend
        run: npm run build

  deployment-config:
    name: Validate deployment configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate shell scripts
        run: bash -n scripts/deploy.sh scripts/auto-deploy.sh scripts/server_monitor.sh

      - name: Validate production Compose file
        run: |
          cp apps/backend/.env.example apps/backend/.env
          cp apps/parser/.env.example apps/parser/.env
          docker compose --env-file apps/backend/.env -f docker-compose.prod.yml config --quiet

  deploy:
    name: Deploy production
    needs: [backend-tests, frontend-build, deployment-config]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: prod
      url: ${{ vars.PROD_URL }}
    concurrency:
      group: castleweb-production
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate production secrets
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          missing=()
          for name in PROD_HOST PROD_USER PROD_SSH_KEY; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing required production secrets: ${missing[*]}" >&2
            exit 1
          fi

      - name: Deploy exact commit over SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_PATH: ${{ vars.PROD_PATH }}
          PUBLIC_HEALTH_URL: ${{ vars.PROD_HEALTH_URL }}
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_PORT || '22' }}
          fingerprint: "SHA256:MWQH2Znn6MkuFV6lQTRR+QM6fyGFvNuNVcxj85cgVqc"
          command_timeout: 40m
          envs: DEPLOY_SHA,DEPLOY_PATH,PUBLIC_HEALTH_URL
          script_path: scripts/auto-deploy.sh
